<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background pill -->
  <rect width="32" height="32" rx="8" fill="hsl(155, 60%, 22%)"/>
  <!-- Track line -->
  <path d="M5 22 L11 22 L17 11 L27 11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Node 1 — start (filled) -->
  <circle cx="5" cy="22" r="2.5" fill="white"/>
  <!-- Node 2 — pivot (filled) -->
  <circle cx="17" cy="11" r="2.5" fill="white"/>
  <!-- Node 3 — goal (hollow) -->
  <circle cx="27" cy="11" r="3" stroke="white" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
